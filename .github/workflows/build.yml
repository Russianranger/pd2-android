name: Android preview

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare relocated runtime
        run: |
          python3 -m pip install zstandard==0.25.0
          python3 -m unittest discover -s tests -p 'test_runtime_fetch.py' -v
          python3 -m unittest discover -s tests -p 'test_runtime_baseline.py' -v
          python3 scripts/fetch-runtime.py
          python3 scripts/relocate-runtime.py
          python3 scripts/relocate-runtime.py --check
          python3 scripts/fetch-runtime.py --check-final
          python3 -m unittest discover -s tests -p 'test_runtime_relocation.py' -v
          ./scripts/test-import.sh
          python3 tests/test_input_router.py
          python3 tests/test_crash_recovery.py
          python3 tests/test_session_logs.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Wine 9 controller backend
        run: |
          python3 scripts/build-controller-runtime.py --check
          python3 -m unittest discover -s tests -p 'test_controller_runtime.py' -v
      - name: Test Android 13 startup and build ARM64 preview
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload Android startup test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Package APK and checksums
        id: package
        run: ./scripts/package-preview.sh
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PD2-Android-${{ steps.package.outputs.version }}-preview
          path: |
            ${{ steps.package.outputs.apk_path }}
            app/build/distributions/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged preview
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PD2_PREVIEW_VERSION: ${{ steps.package.outputs.version }}
          PD2_PREVIEW_APK: ${{ steps.package.outputs.apk_path }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --prerelease \
            --title "PD2 Android $PD2_PREVIEW_VERSION Preview" \
            --notes-file "docs/RELEASE-$PD2_PREVIEW_VERSION.md" \
            "$PD2_PREVIEW_APK" \
            app/build/distributions/SHA256SUMS
