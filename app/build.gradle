apply plugin: 'com.android.application'

android {
    // Keep upstream package names for JNI symbol compatibility.
    namespace 'com.winlator'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '24.0.8215888'

    defaultConfig {
        applicationId 'com.pd2.thor'
        minSdk 26
        // Android 13 blocks exec from app data for apps targeting SDK 29+.
        // Wine/Box64 launch native children; retain the qualified upstream target.
        targetSdk 28
        versionCode 10
        versionName '0.1.9'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        preview {
            // Public preview identity. Never use this key for production publishing.
            storeFile rootProject.file('signing/pd2-preview.jks')
            storePassword 'android'
            keyAlias 'pd2-preview'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.preview
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.preview
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            // The child runtime loads extracted Android native libraries by path.
            useLegacyPackaging true
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    lint {
        checkReleaseBuilds false
    }
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
    implementation 'androidx.lifecycle:lifecycle-process:2.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
